<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0f17; color: #f1f5f9; margin: 0; padding: 16px; }
    .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1e293b; padding-bottom: 10px; }
    .logo { font-size: 14px; font-weight: 700; color: #f87171; letter-spacing: 0.05em; }
    .status-badge { font-size: 10px; padding: 2px 8px; border-radius: 9999px; background: #059669; color: #fff; font-weight: 600; }
    .content { margin-top: 14px; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 6px; padding: 10px; margin-bottom: 10px; font-size: 12px; }
    .btn { display: block; width: 100%; text-align: center; background: #dc2626; color: white; border: none; padding: 8px 0; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer; text-decoration: none; box-sizing: border-box; }
    .btn:hover { background: #b91c1c; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">THREAT ANALYZE</div>
    <span class="status-badge" id="shieldStatus">CONNECTED</span>
  </div>
  <div class="content">
    <div class="card">
      <div style="color: #94a3b8; font-size: 11px;">Current Domain Protection</div>
      <div style="font-weight: 600; margin-top: 4px;" id="currentDomain">Inspecting Tab...</div>
    </div>
    <a href="http://localhost:3000/dashboard" target="_blank" class="btn">Open SOC Dashboard</a>
  </div>
  <script>
    chrome.tabs?.query({ active: true, currentWindow: true }, (tabs) => {
      if (tabs && tabs[0] && tabs[0].url) {
        try {
          const u = new URL(tabs[0].url);
          document.getElementById('currentDomain').innerText = u.hostname;
        } catch(e) {
          document.getElementById('currentDomain').innerText = 'System Page';
        }
      }
    });
  </script>
</body>
</html>
